name: 이터널 리턴 패치노트 알림

on:
  schedule:
    - cron: "*/10 * * * *"  # 10분마다 (GitHub 사정에 따라 몇 분 늦을 수 있음)
  workflow_dispatch:        # Actions 탭에서 수동 실행
    inputs:
      mode:
        description: "once=새 글 확인 / test=목록만 출력 / send-latest=최신 패치노트 1개 바로 전송"
        type: choice
        options: [once, test, send-latest]
        default: once
      ids:
        description: "다시 보낼 공식 홈페이지 글 번호 (예: 3948,3949). 입력하면 mode 대신 이 글들을 전송"
        type: string
        default: ""

permissions:
  contents: write  # state.json(이미 보낸 글 기록) 저장용

concurrency:
  group: patch-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 패치노트 확인 및 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PATCH_SOURCES: ${{ vars.PATCH_SOURCES || 'official' }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          MODE: ${{ inputs.mode || 'once' }}
          IDS: ${{ inputs.ids }}
        run: |
          if [ -n "$IDS" ]; then
            python patch_notifier.py --send-ids "$IDS"
          else
            python patch_notifier.py "--$MODE"
          fi

      - name: 기록 저장
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "패치노트 기록 업데이트" && git push)
